name: Development dependency snapshot
on:
  push:
    branches: [work/date-wallet-filters]
    paths: [.github/workflows/dev-dependencies.yml]
permissions:
  contents: read
jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip download --only-binary=:all: --no-deps 'duckdb>=1.4.3,<2' -d wheels
      - uses: actions/upload-artifact@v4
        with:
          name: development-wheels
          path: wheels/
          retention-days: 1
