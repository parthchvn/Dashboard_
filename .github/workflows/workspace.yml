name: Granularity development snapshot
on:
  push:
    branches: [work/granularity-workspace]
    paths: [.github/workflows/workspace.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=tar HEAD -o source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: granularity-source
          path: source.tar
          retention-days: 1
