name: Development source snapshot
on:
  push:
    branches: [work/date-wallet-filters]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=tar HEAD -o source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: source-workspace
          path: source.tar
          retention-days: 1
