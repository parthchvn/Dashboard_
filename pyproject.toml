[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "xvi-market-observatory"
version = "0.1.0"
description = "An observation-aware historical Polymarket dashboard"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.4.3,<2", "fastapi>=0.128,<1", "uvicorn>=0.30,<1", "filelock>=3.16,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]
review = ["pandas>=2.2,<3", "numpy>=1.26,<3"]

[project.scripts]
xvi = "xvi.__main__:main"

[tool.setuptools.packages.find]
include = ["xvi*"]

[tool.setuptools.package-data]
xvi = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
